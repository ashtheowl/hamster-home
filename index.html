<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belle's Hamster Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EC; --card: #FFFFFF; --ink: #4A3426; --soft: #8A6E5C;
    --pink: #FF7EB3; --pink-d: #E0558F; --teal: #2FB8A9; --sun: #FFD166; --line: #F0DCC8;
    --cell: 50px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Fredoka', system-ui, 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  input { user-select: text; -webkit-user-select: text; }
  header {
    text-align: center; padding-block: 16px 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); color: var(--pink-d); }
  .sub { margin: 2px 0 0; color: var(--soft); font-size: 18px; }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding-block: 14px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top > *, .build > * { min-width: 0; }
  @media (prefers-reduced-motion: reduce) {
    .twinkle, .needicon, .item.empty::after, .need.low span:first-child { animation: none !important; }
  }
  .card { background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: 0 4px 0 var(--line); }
  h2 { margin: 0 0 10px; font-size: 21px; }
  .small { font-size: 15px; color: var(--soft); margin: 6px 0 0; }

  /* Top row */
  .top { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
  .picker { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
  .pick {
    flex: 0 0 auto; width: 96px; border: 3px solid transparent; background: #FFF1E2;
    border-radius: 16px; padding: 6px 6px 4px; cursor: pointer; font: inherit; color: inherit;
    transition: transform .15s;
  }
  .pick:hover { transform: translateY(-2px); }
  .pick svg { width: 74px; height: 62px; display: block; margin: 0 auto; }
  .pick span { font-size: 15px; display: block; }
  .pick.on { border-color: var(--pink); background: #FFE3EF; }
  .pick { position: relative; }
  .cagebadge { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 16px; }
  .namerow { flex-wrap: wrap; }
  .btn.incage { font-size: 16px; }
  .btn.incage.on { background: #D9F5EF; color: #1E7E73; font-weight: 600; }
  .hamster.chosen .nametag { background: var(--pink); color: #fff; }
  .namerow { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 18px; }
  .namerow input {
    font: inherit; font-size: 19px; padding: 6px 12px; border-radius: 12px;
    border: 2px solid var(--line); width: 220px; max-width: 100%; color: var(--ink);
  }
  .namerow input:focus { outline: none; border-color: var(--pink); }
  .dress { margin-top: 12px; border-top: 2px dashed var(--line); padding-top: 8px; }
  .dress h3 { margin: 0 0 2px; font-size: 18px; }
  .slot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .slot b { width: 70px; font-size: 15px; font-weight: 600; }
  .acc { font: inherit; font-size: 14px; border: 2px solid var(--line); background: #FFF8F0; border-radius: 999px; padding: 3px 10px; cursor: pointer; color: inherit; }
  .acc:hover { background: #FFE3EF; }
  .acc.on { border-color: var(--pink); background: #FFE3EF; font-weight: 600; }
  .slot.cols { margin-top: 4px; gap: 5px; }
  .slot.cols b { font-weight: 400; color: var(--soft); font-size: 14px; }
  .slot.cols .sw { width: 28px; height: 28px; }
  .happy { text-align: center; }
  .face { font-size: 46px; line-height: 1; }
  .meter { height: 22px; border-radius: 999px; background: #FFE9D6; overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; width: 60%; background: linear-gradient(90deg, #FFB3D1, var(--pink)); transition: width .4s; border-radius: 999px; }
  #happyText { font-weight: 600; color: var(--ink); font-size: 17px; }
  .needs { display: grid; gap: 6px; margin-top: 8px; text-align: left; }
  .need { display: grid; grid-template-columns: 26px 64px 1fr; align-items: center; gap: 6px; font-size: 15px; }
  .need .meter { margin: 0; height: 16px; }
  .need.low .meter i { background: linear-gradient(90deg, #FF8A80, #FF5A5A); }
  .need.low span:first-child { animation: bounce .6s ease-in-out infinite alternate; display: inline-block; }
  .needicon {
    position: absolute; right: -24%; top: 0; z-index: 2; pointer-events: none;
    background: #fff; border: 2px solid #FF5A5A; border-radius: 50%;
    width: calc(var(--cell) * .62); height: calc(var(--cell) * .62);
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .36);
    animation: bounce .7s ease-in-out infinite alternate;
  }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-25%); } }

  /* Build row */
  .build { display: grid; grid-template-columns: 330px 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { font: inherit; font-size: 16px; border: none; border-radius: 999px; padding: 6px 12px; background: #FFF1E2; cursor: pointer; color: inherit; }
  .tab.on { background: var(--teal); color: #fff; }
  .swatches { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; font-size: 15px; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
  .sw.on { box-shadow: 0 0 0 3px var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .tile {
    background: #FFF8F0; border: 3px solid var(--line); border-radius: 16px; padding: 6px 4px 4px;
    text-align: center; cursor: grab; touch-action: none; transition: transform .12s;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile.on { border-color: var(--pink); background: #FFE3EF; }
  .tile .prev { height: 54px; display: flex; align-items: center; justify-content: center; }
  .tile .prev svg { width: 62px; height: 54px; }
  .tile .prev .emoji { font-size: 38px; }
  .tile .lbl { font-size: 14px; margin-top: 2px; }
  .bin { margin-top: 12px; border: 3px dashed var(--line); border-radius: 16px; padding: 12px; text-align: center; color: var(--soft); transition: .15s; }
  .bin.hot { border-color: var(--pink-d); background: #FFE3EF; color: var(--pink-d); transform: scale(1.03); }

  /* Cage */
  .cage {
    position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 18px; overflow: hidden;
    background-color: #F6E3BF;
    background-image:
      radial-gradient(ellipse 4px 1.6px, #E4C384 60%, transparent 70%),
      radial-gradient(ellipse 3px 1.4px, #FFF4DC 60%, transparent 70%),
      radial-gradient(#E6C488 1.3px, transparent 1.8px);
    background-size: 19px 13px, 27px 17px, 11px 11px; background-position: 0 0, 9px 7px, 4px 3px;
    border: 9px solid var(--pink);
    box-shadow: 0 6px 0 var(--pink-d), inset 0 0 0 3px rgba(255,255,255,.45),
      inset 0 calc(var(--cell) * .5) calc(var(--cell) * .9) rgba(120, 70, 20, .28),
      inset 0 calc(var(--cell) * -.2) calc(var(--cell) * .5) rgba(120, 70, 20, .15);
  }
  .cage.placing::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image: linear-gradient(rgba(90,64,48,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(90,64,48,.13) 1px, transparent 1px);
    background-size: calc(100% / 12) calc(100% / 8);
  }
  .cage.placing { cursor: copy; }
  .item { position: absolute; z-index: 2; touch-action: none; cursor: grab; display: flex; align-items: center; justify-content: center; }
  .item svg { width: 100%; height: 100%; display: block; }
  .item > svg, .item > .emoji { filter: drop-shadow(0 calc(var(--cell) * .08) calc(var(--cell) * .05) rgba(90, 55, 20, .38)); }
  .paint { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; filter: var(--pf); }
  .paint > svg { width: 100%; height: 100%; }
  .item > .paint { filter: var(--pf) drop-shadow(0 calc(var(--cell) * .08) calc(var(--cell) * .05) rgba(90, 55, 20, .38)); }
  .tile .prev .paint { width: auto; height: auto; }
  .item.empty::after {
    content: '!'; position: absolute; top: -14%; right: -8%; z-index: 5;
    width: calc(var(--cell) * .5); height: calc(var(--cell) * .5); border-radius: 50%;
    background: #FF5A5A; color: #fff; border: 2px solid #fff; font-weight: 700; font-size: calc(var(--cell) * .34);
    display: flex; align-items: center; justify-content: center; animation: bounce .7s ease-in-out infinite alternate;
  }
  .sw.orig { background: conic-gradient(#F0645A, #F4CF3A, #62C46A, #4E95EE, #9B6CF0, #F0645A); }
  .toolbar { flex-wrap: wrap; justify-content: center; max-width: 92%; }
  .toolbar .sw { width: 36px; height: 36px; margin: 5px 1px; border-radius: 50%; }
  .sw.orig, .toolbar .sw.orig:hover { background: conic-gradient(#F0645A, #F4CF3A, #62C46A, #4E95EE, #9B6CF0, #F0645A); }
  .item.sel { outline: 3px dashed var(--teal); outline-offset: 1px; border-radius: 6px; z-index: 3; }
  .item.lifted { opacity: .25; }
  .poo { position: absolute; z-index: 4; transform: translate(-50%, -50%); font-size: calc(var(--cell) * .52); line-height: 1; padding: 4px;
    cursor: pointer; animation: popin .3s ease-out; filter: drop-shadow(0 2px 1px rgba(90, 55, 20, .35)); }
  .poo:hover { transform: translate(-50%, -50%) scale(1.2); }
  .item.held { z-index: 6; animation: wiggle .18s ease-in-out infinite alternate; cursor: grabbing; }
  @keyframes wiggle { from { transform: scale(1.1) rotate(-4deg); } to { transform: scale(1.1) rotate(4deg); } }
  .item.new { animation: popin .35s ease-out; }
  .item.eaten { animation: eaten .45s forwards; }
  .emoji { font-size: calc(var(--cell) * .78 * var(--s, 1)); line-height: 1; }
  .wheel-spin { transform-origin: 50px 46px; }
  .spin .wheel-spin { animation: spin .45s linear infinite; }
  .preview { position: absolute; z-index: 1; border: 3px dashed var(--teal); border-radius: 8px; background: rgba(47,184,169,.15); pointer-events: none; }
  .ghost {
    position: fixed; z-index: 1000; pointer-events: none; display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%) scale(1.1); opacity: .9; filter: drop-shadow(0 8px 6px rgba(0,0,0,.25));
  }
  .ghost svg { width: 100%; height: 100%; }

  .hamster { position: absolute; z-index: 20; cursor: pointer; }
  .placing .hamster { pointer-events: none; }
  .hbody, .hface { width: 100%; height: 100%; }
  .hface svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 calc(var(--cell) * .07) calc(var(--cell) * .05) rgba(90, 55, 20, .35)); }
  .hbody, .nametag { transition: opacity .3s; }
  .inside .hbody, .inside .nametag { opacity: 0; }
  .hbody { transition: opacity .3s, scale .25s; }
  .intube .hbody { scale: .58; opacity: .92; }
  .intube .nametag { opacity: 0; }

  /* Day and night */
  body { transition: background-color 2s; }
  body.night { background-color: #2E2A55; }
  body.night header h1 { color: #FFB3D1; }
  body.night .sub { color: #D8D0F5; }
  .sky {
    position: absolute; inset: 0; z-index: 15; pointer-events: none; opacity: 0; transition: opacity 2s;
    background: radial-gradient(circle at 88% 12%, rgba(255, 250, 210, .25), transparent 22%), rgba(20, 24, 80, .5);
  }
  .night .sky { opacity: 1; }
  .sky .moon { position: absolute; right: 4%; top: 4%; font-size: calc(var(--cell) * .9); }
  .sky .twinkle { position: absolute; color: #FFF6C8; font-size: calc(var(--cell) * .28); animation: twinkle 2s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .2; transform: scale(.7); } to { opacity: 1; transform: scale(1.1); } }
  .hface.flip { transform: scaleX(-1); }
  .walking .hbody { animation: waddle .28s ease-in-out infinite alternate; }
  .running .hbody { animation: waddle .11s ease-in-out infinite alternate; }
  .sleeping .hbody { transform: scale(.88) translateY(8%); filter: saturate(.75); }
  .hop .hbody { animation: hop .5s ease-out; }
  .hamster.pop .hbody { animation: popin .4s ease-out; }
  .bubble {
    position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -4px) scale(0); transform-origin: bottom center;
    background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 2px 10px;
    font-weight: 600; font-size: clamp(13px, 1.6vw, 18px); white-space: nowrap; transition: transform .2s; pointer-events: none;
  }
  .bubble.show { transform: translate(-50%, -4px) scale(1); }
  .nametag {
    position: absolute; left: 50%; top: 94%; transform: translateX(-50%); pointer-events: none;
    background: rgba(255,255,255,.88); border-radius: 10px; padding: 0 8px; font-size: clamp(11px, 1.3vw, 15px); font-weight: 600; white-space: nowrap;
  }
  .heart { position: absolute; z-index: 25; pointer-events: none; font-size: calc(var(--cell) * .5); animation: floatup 1.1s ease-out forwards; }
  .toolbar { position: absolute; z-index: 40; display: flex; gap: 6px; background: #fff; border-radius: 14px; padding: 5px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .toolbar button { font-size: 22px; border: none; background: #FFF1E2; border-radius: 10px; width: 46px; height: 46px; cursor: pointer; }
  .toolbar button:hover { background: #FFE3EF; }
  .help { font-size: 17px; margin: 14px 2px 8px; min-height: 2.6em; }
  .cage-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 16px; border: none; border-radius: 999px; padding: 8px 16px; background: #FFF1E2; cursor: pointer; color: inherit; }
  .btn:hover { background: #FFE3EF; }

  /* Mini games */
  .games-card { margin-top: 16px; }
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .game { background: #FFF8F0; border: 3px dashed var(--line); border-radius: 18px; padding: 14px; display: flex; gap: 12px; align-items: center; }
  .game .big { font-size: 40px; }
  .game b { display: block; font-size: 18px; }
  .soon { display: inline-block; margin-top: 4px; background: var(--sun); border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 600; }
  button.game { font: inherit; color: inherit; text-align: left; cursor: pointer; border-style: solid; transition: transform .15s; }
  button.game:hover { transform: translateY(-3px); border-color: var(--pink); background: #FFE3EF; }

  /* Mini game window */
  .modal {
    position: fixed; inset: 0; z-index: 500; background: rgba(40, 25, 60, .6); display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  }
  .modal-card { position: relative; background: #fff; border-radius: 24px; width: 100%; max-width: 620px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px 18px 18px; overflow-x: hidden; }
  .modal-card h2 { padding-right: 44px; }
  .close { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: none; background: #FFF1E2; font-size: 18px; cursor: pointer; }
  .close:hover { background: #FFE3EF; }
  .gstats { display: flex; gap: 16px; justify-content: center; font-weight: 600; margin: 8px 0; font-size: 17px; }
  .gmsg { text-align: center; font-size: 19px; font-weight: 600; min-height: 1.4em; margin: 10px 0 0; }
  .gmsg .btn { margin-top: 10px; }
  .btn.big { background: var(--pink); color: #fff; }
  .btn.big:hover { background: var(--pink-d); }

  .maze-wrap { position: relative; width: min(100%, 440px); aspect-ratio: 1; margin: 0 auto; background: #F6E3BF; border: 5px solid #8C5A2E; border-radius: 10px; touch-action: none; }
  .maze-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .mz-tok { position: absolute; display: flex; align-items: center; justify-content: center; transition: left .13s linear, top .13s linear; pointer-events: none; }
  .mz-tok.emo { font-size: var(--mzf, 24px); line-height: 1; }
  .mz-tok.me .mzham { width: 118%; height: 100%; flex: none; }
  .mz-tok.me svg { width: 100%; height: 100%; }
  .mz-tok.me.flip .mzham { transform: scaleX(-1); }
  .pad { display: grid; grid-template-columns: repeat(3, 66px); gap: 6px; justify-content: center; margin-top: 12px; }
  .pad button { height: 56px; font-size: 26px; border: none; border-radius: 14px; background: #FFF1E2; cursor: pointer; touch-action: manipulation; }
  .pad button:active { background: #FFE3EF; transform: scale(.95); }

  .track { position: relative; border-radius: 14px; overflow: hidden; border: 4px solid #62C46A; background: #88D07A; }
  .lane { position: relative; height: 66px; background: #EBCB92; border-bottom: 3px dashed #fff; }
  .lane:nth-child(even) { background: #E2BE7F; }
  .lane.me { background: #FFD9E8; }
  .lane .lname { position: absolute; left: 6px; bottom: 2px; font-size: 13px; font-weight: 600; z-index: 2; }
  .racer { position: absolute; top: 3px; height: 50px; width: 62px; left: 0; z-index: 3; }
  .racer .rbody, .racer svg { width: 100%; height: 100%; display: block; }
  .racer.go .rbody { animation: waddle .1s ease-in-out infinite alternate; }
  .finish { position: absolute; top: 0; bottom: 0; left: 88%; width: 12px; z-index: 1;
    background: repeating-linear-gradient(#333 0 8px, #fff 8px 16px); background-size: 6px 16px;
    background-image: repeating-linear-gradient(#333 0 8px, #fff 8px 16px), repeating-linear-gradient(#fff 0 8px, #333 8px 16px);
    background-position: 0 0, 6px 0; background-repeat: repeat-y; }
  .count { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; pointer-events: none;
    font-size: 76px; font-weight: 700; color: #fff; text-shadow: 0 5px 0 var(--pink-d); }
  .tapbtn { font: inherit; font-size: 26px; font-weight: 600; padding: 16px 34px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-d); touch-action: manipulation; user-select: none; }
  .tapbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-d); }
  .tapbtn:disabled { opacity: .5; cursor: default; }
  .confetti { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; z-index: 10; pointer-events: none; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* Shared play area for the newer mini games */
  .games { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .arena { position: relative; width: 100%; max-width: 520px; aspect-ratio: 4 / 3; margin: 0 auto; border-radius: 16px; overflow: hidden;
    background: #F6E3BF; touch-action: none; user-select: none; -webkit-user-select: none; border: 4px solid #E9C98F; }
  .arena .spr { position: absolute; transform: translate(-50%, -50%); line-height: 1; }
  /* on short screens, shrink the play area so the buttons underneath still fit */
  .arena { max-width: min(520px, max(240px, (100vh - 330px) * 4 / 3)); }
  .wheelarena { max-width: min(520px, max(220px, (100vh - 420px) * 4 / 3)); }
  .maze-wrap { width: min(100%, 440px, max(220px, 100vh - 330px)); }
  .floaty { position: absolute; z-index: 6; pointer-events: none; font-weight: 700; color: var(--pink-d); background: rgba(255, 255, 255, .85);
    border-radius: 10px; padding: 0 8px; white-space: nowrap; font-size: clamp(14px, 3.5vw, 20px); animation: floatup 1.1s ease-out forwards; }
  .okword { color: #3A8A42; }

  .skyarena { background: linear-gradient(#BFE6FF, #FFF1DA 75%, #F2D8A8 75%); border-color: #9AD7FF; }
  .catcher { position: absolute; bottom: 3%; width: 17%; aspect-ratio: 1.2; transform: translateX(-50%); }
  .catcher svg { width: 100%; height: 100%; display: block; }
  .catcher.flip svg { transform: scaleX(-1); }
  .fall { font-size: clamp(22px, 6vw, 36px); }

  .bigham { position: absolute; left: 50%; top: 55%; width: 42%; aspect-ratio: 1.2; transform: translate(-50%, -50%); transition: left 1.1s ease-in; }
  .bigham svg { width: 100%; height: 100%; display: block; }
  .bigham.runoff { left: 140%; }
  .pouch { position: absolute; top: 60%; width: 13%; aspect-ratio: 1; border-radius: 50%; border: 2px solid #5A4030;
    background: radial-gradient(circle at 50% 55%, rgba(255, 157, 187, .55), transparent 65%), var(--pouch, #F0A84E);
    transform: translate(-50%, -50%) scale(var(--cheek, 1)); transition: transform .15s; }
  .pouch.l { left: 55%; } .pouch.r { left: 80%; }
  .snackpop { font-size: clamp(28px, 8vw, 44px); border: none; background: rgba(255, 255, 255, .7); border-radius: 50%; width: 1.6em; height: 1.6em;
    display: flex; align-items: center; justify-content: center; cursor: pointer; animation: popin .25s ease-out; padding: 0; }

  .burrows { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4%; padding: 4%; background: #DDBB7E; }
  .hole { position: relative; overflow: hidden; cursor: pointer; }

  state.items = state.items.filter(it => DEFS[it.type]);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const cage = $('cage'), itemsLayer = $('items');
  const toolbar = $('toolbar'), preview = $('preview'), ghost = $('ghost'), bin = $('bin');
  const pct = (v, n) => (v / n * 100) + '%';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pickRand = a => a[Math.floor(Math.random() * a.length)];
  const findItem = id => state.items.find(it => it.id === id);
  const sizeOfType = t => [DEFS[t].w || 1, DEFS[t].h || 1];
  const cellPx = () => cage.getBoundingClientRect().width / COLS;
  const hamDef = () => HAMSTERS.find(h => h.id === state.ham) || HAMSTERS[0];
  const nameOf = id => (state.names[id] || '').trim() || HAMSTERS.find(h => h.id === id).name;

  let shelfCat = 'tubes', selectedShelf = null, selectedId = null, paintOpen = false, heldId = null;
  const spinning = new Set();   // wheels with a hamster running in them

  // Some things changed size, so keep older saved cages inside the walls
  for (const it of state.items) {
    const [w, h] = sizeOfType(it.type);
    it.c = clamp(it.c, 0, COLS - w); it.r = clamp(it.r, 0, ROWS - h);
  }

  new ResizeObserver(() => document.documentElement.style.setProperty('--cell', cellPx() + 'px')).observe(cage);

  // ---------- Sounds ----------
  let actx = null;
  function beep(f1, f2, len, vol, type = 'sine') {
    if (!state.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + len);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.02);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + len + 0.05);
    } catch (e) {}
  }
  const squeak = () => { beep(1600, 2700, 0.09, 0.12); setTimeout(() => beep(2200, 1700, 0.08, 0.1), 100); };
  const pop = () => beep(420, 900, 0.08, 0.15, 'triangle');
  const munch = () => { beep(300, 180, 0.05, 0.12, 'square'); setTimeout(() => beep(300, 180, 0.05, 0.1, 'square'), 140); setTimeout(() => beep(300, 180, 0.05, 0.08, 'square'), 280); };

  // ---------- Hamster picker ----------
  function renderPicker() {
    $('picker').innerHTML = HAMSTERS.map(h =>
      `<button class="pick${h.id === state.ham ? ' on' : ''}${state.cage.includes(h.id) ? ' incage' : ''}" data-id="${h.id}" aria-label="${h.label} hamster">` +
      `${state.cage.includes(h.id) ? '<i class="cagebadge" title="In the cage">🏠</i>' : ''}${hamsterSVG(h, outfitOf(h.id))}<span>${h.label}</span></button>`).join('');
    $('name').value = nameOf(state.ham);
    const inCage = state.cage.includes(state.ham);
    $('incage').textContent = inCage ? '🏠 In the cage ✓' : '➕ Put in the cage';
    $('incage').classList.toggle('on', inCage);
    renderDress();
  }
  // put the chosen hamster in the cage, or take it out (there must always be at least one)
  $('incage').addEventListener('click', () => {
    if (state.cage.includes(state.ham)) {
      if (state.cage.length === 1) { say("I don't want to be all alone! Add another hamster first. 🥺", 2600); return; }
      state.cage = state.cage.filter(id => id !== state.ham);
    } else {
      state.cage.push(state.ham);
    }
    save(); syncHerd(); renderPicker(); drawHamster();
    const h = herd.get(state.ham); if (h) h.hi();
  });
  function renderDress() {
    $('dress').innerHTML = `<h3>Dress up ${esc(nameOf(state.ham))} 👒</h3>` + dressHTML(outfitOf(state.ham));
  }
  // a tap on a dress-up button or colour dot, applied to outfit o
  function applyDress(o, b) {
    const slot = b.dataset.slot;
    if (b.dataset.col) o[slot + 'Col'] = b.dataset.col;
    else { o[slot] = b.dataset.acc; delete o[slot + 'Col']; }   // a new item starts in its own colour
  }
  function dressHTML(mine) {
    return Object.entries(ACCESSORIES).map(([slot, group]) =>
      `<div class="slot"><b>${group.label}</b>` +
      `<button class="acc${!mine[slot] ? ' on' : ''}" data-slot="${slot}" data-acc="">None</button>` +
      Object.entries(group.items).map(([id, a]) =>
        `<button class="acc${mine[slot] === id ? ' on' : ''}" data-slot="${slot}" data-acc="${id}">${a.name}</button>`).join('') +
      '</div>' +
      // colour choices appear once something is being worn in this slot
      (mine[slot] && group.items[mine[slot]] ? `<div class="slot cols"><b>Colour</b>` +
        Object.entries(CLOTH_COLOURS).map(([k, c]) =>
          `<button class="sw${slotColour(mine, slot) === k ? ' on' : ''}" data-slot="${slot}" data-col="${k}" style="background:${c.m}" aria-label="${c.name}" title="${c.name}"></button>`).join('') +
        '</div>' : '')).join('');
  }
  $('dress').addEventListener('click', e => {
    const b = e.target.closest('.acc, .sw'); if (!b) return;
    state.outfits = state.outfits || {};
    const o = Object.assign({}, outfitOf(state.ham));
    applyDress(o, b);
    state.outfits[state.ham] = o; save();
    renderPicker(); drawHamster();
    if (b.dataset.col) { pop(); say(pickRand(['Ooh, I like that colour!', 'Pretty!', 'So colourful!'])); }
    else if (b.dataset.acc) { squeak(); hearts(2); say(pickRand(['Do I look nice?', 'Ooh, fancy!', 'I love it!', 'So stylish!'])); }
  });
  $('picker').addEventListener('click', e => {
    const b = e.target.closest('.pick'); if (!b) return;
    selectHamster(b.dataset.id);
  });
  function selectHamster(id) {
    state.ham = id; save();
    renderPicker(); drawHamster();
    const h = herd.get(id); if (h) h.hi();
  }
  $('name').addEventListener('input', e => {
    state.names[state.ham] = e.target.value; save();
    $('dress').querySelector('h3').textContent = `Dress up ${nameOf(state.ham)} 👒`;
    drawHamster();
  });
  function drawHamster() {
    herd.forEach(h => { h.draw(); h.el.classList.toggle('chosen', h.id === state.ham && herd.size > 1); });
    renderNeeds();
  }

  // ---------- Needs: food, drink, sleep and fun ----------
  const NEEDS = [
    { k: 'food',  icon: '🍎', label: 'Food',  low: 'Hungry!', ask: '🥣' },
    { k: 'drink', icon: '💧', label: 'Drink', low: 'Thirsty!', ask: '💧' },
    { k: 'sleep', icon: '😴', label: 'Sleep', low: 'Sleepy!', ask: '😴' },
    { k: 'fun',   icon: '🎾', label: 'Fun',   low: 'Bored!', ask: '🎾' },
  ];
  const DECAY = { food: 3, drink: 4, sleep: 2, fun: 3 };   // lost every 10 seconds
  $('needs').innerHTML = [...NEEDS, { k: 'clean', icon: '🧹', label: 'Clean' }].map(n =>
    `<div class="need" id="need-${n.k}"><span>${n.icon}</span><span>${n.label}</span><div class="meter"><i></i></div></div>`).join('');
  const cleanliness = () => Math.max(0, 100 - state.poos.length * 15);
  function lowestOf(needs) {
    return NEEDS.reduce((a, b) => needs[b.k] < needs[a.k] ? b : a);
  }
  // the bars at the top show the chosen hamster; every hamster in the cage gets its own "I need…" icon
  function renderNeeds() {
    const needs = needsOf(state.ham);
    for (const n of NEEDS) {
      const row = $('need-' + n.k), v = needs[n.k];
      row.querySelector('i').style.width = v + '%';
      row.classList.toggle('low', v < 30);
    }
    const avg = NEEDS.reduce((s, n) => s + needs[n.k], 0) / NEEDS.length;
    const low = lowestOf(needs), lowV = needs[low.k];
    $('hname').textContent = nameOf(state.ham);
    $('face').textContent = lowV < 20 ? '😢' : avg < 45 ? '🙂' : avg < 75 ? '😄' : '🥰';
    const clean = cleanliness();
    $('need-clean').querySelector('i').style.width = clean + '%';
    $('need-clean').classList.toggle('low', clean < 50);
    $('happyText').textContent = lowV < 30 ? `${low.low} ${nameOf(state.ham)} needs you!`
      : clean < 50 ? 'Eww! The cage needs cleaning! 💩' : avg < 75 ? 'Happy!' : 'Super happy!';
    if (clean < 50 && lowV >= 20) $('face').textContent = '😖';
    herd.forEach(h => {
      const hn = needsOf(h.id), l = lowestOf(hn);
      h.setNeedIcon(hn[l.k] < 30 ? l.ask : '');
    });
  }
  function addNeedFor(id, k, n) { const needs = needsOf(id); needs[k] = clamp(needs[k] + n, 0, 100); renderNeeds(); save(); }
  function addNeed(k, n) { addNeedFor(state.ham, k, n); }   // mini games reward the chosen hamster
  setInterval(() => {
    herd.forEach(h => {
      const needs = needsOf(h.id);
      for (const k in DECAY) {
        if (k === 'sleep' && h.resting()) continue;
        // hamsters get sleepy in the day and want to play at night
        const rate = k === 'sleep' ? (state.night ? 1 : 2.5) : k === 'fun' ? (state.night ? 4 : 3) : DECAY[k];
        needs[k] = clamp(needs[k] - rate, 0, 100);
      }
      needs.fun = clamp(needs.fun - state.poos.length * 0.6, 0, 100);   // a messy cage is no fun
      if (Math.random() < 0.06) h.poo();
    });
    renderNeeds(); save();
  }, 10000);

  // ---------- Shelf ----------
  function renderShelf() {
    $('tabs').innerHTML = CATS.map(c => `<button class="tab${c.id === shelfCat ? ' on' : ''}" data-cat="${c.id}">${c.label}</button>`).join('');
    const sw = $('swatches');
    sw.hidden = shelfCat === 'snacks';
    sw.innerHTML = shelfCat === 'tubes' ? 'Colour: ' + tubeSwatches(state.tubeColour) : 'Colour: ' + paintSwatches(state.paint);
    const tiles = $('tiles');
    tiles.innerHTML = '';
    for (const [type, d] of Object.entries(DEFS)) {
      if (d.cat !== shelfCat) continue;
      const t = document.createElement('div');
      t.className = 'tile' + (selectedShelf === type ? ' on' : '');
      t.innerHTML = `<div class="prev">${itemHTML({ type, ci: state.tubeColour, rot: 0, paint: state.paint })}</div><div class="lbl">${d.label}</div>`;
      t.addEventListener('pointerdown', e => startPress(e, { kind: 'shelf', type }));
      tiles.appendChild(t);
    }
  }
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    shelfCat = b.dataset.cat; renderShelf();
  });
  function tubeSwatches(on) {
    return TUBE_COLOURS.map(([c], i) =>
      `<button class="sw${i === on ? ' on' : ''}" data-ci="${i}" style="background:${c}" aria-label="Tube colour ${i + 1}"></button>`).join('');
  }
  function paintSwatches(on) {
    return PAINTS.map((p, i) => p
      ? `<button class="sw${i === on ? ' on' : ''}" data-paint="${i}" style="background:${p.c}" aria-label="${p.name}" title="${p.name}"></button>`
      : `<button class="sw orig${i === on ? ' on' : ''}" data-paint="0" aria-label="Its own colours" title="Its own colours"></button>`).join('');
  }
  $('swatches').addEventListener('click', e => {
    const b = e.target.closest('.sw'); if (!b) return;
    if (b.dataset.ci !== undefined) state.tubeColour = +b.dataset.ci;
    else state.paint = +b.dataset.paint;
    save(); renderShelf();
  });
  $('swatches').style.flexWrap = 'wrap';
  function toggleShelf(type) {
    selectedShelf = selectedShelf === type ? null : type;
    selectedId = null;
    cage.classList.toggle('placing', !!selectedShelf);
    renderShelf(); renderItems(); updateHelp();
  }

  function updateHelp() {
    $('help').textContent = selectedShelf
      ? `👆 Tap in the cage to add the ${DEFS[selectedShelf].label.toLowerCase()}. Tap it on the shelf again when you're finished.`
      : '👆 Tap something in the cage and your hamster will go to it! ✋ Hold your finger on something until it wiggles, then drag it to move it, or into the bin to throw it away. Hold and let go to paint 🎨 or turn it. Tap 💩 to clean it up!';
  }

  // ---------- Cage items ----------
  function renderItems() {
    itemsLayer.innerHTML = '';
    for (const it of state.items) {
      const [w, h] = sizeOfType(it.type);
      const el = document.createElement('div');
      el.className = 'item' + (it.id === selectedId ? ' sel' : '') + (spinning.has(it.id) ? ' spin' : '') + (it.id === heldId ? ' held' : '') +
        (DEFS[it.type].refill && fillOf(it) <= 0.02 ? ' empty' : '');
      el.dataset.id = it.id;
      Object.assign(el.style, { left: pct(it.c, COLS), top: pct(it.r, ROWS), width: pct(w, COLS), height: pct(h, ROWS) });
      if (DEFS[it.type].flat) el.style.zIndex = 1;   // rugs lie underneath everything
      el.innerHTML = itemHTML(it);
      el.addEventListener('pointerdown', e => startPress(e, { kind: 'placed', id: it.id }));
      itemsLayer.appendChild(el);
    }
    renderToolbar();
  }
  const itemEl = id => itemsLayer.querySelector(`[data-id="${id}"]`);

  function addItem(type, cell) {
    const it = { id: state.nextId++, type, c: cell.c, r: cell.r };
    if (DEFS[type].tube) { it.ci = state.tubeColour; it.rot = 0; }
    else if (paintable(type) && state.paint) it.paint = state.paint;
    state.items.push(it); save(); renderItems();
    const el = itemEl(it.id); if (el) el.classList.add('new');
    pop();
  }
  function removeItem(id) {
    state.items = state.items.filter(it => it.id !== id);
    if (selectedId === id) selectedId = null;
    save(); renderItems();
  }

  function renderToolbar() {
    const it = selectedId && findItem(selectedId);
    if (!it) { toolbar.hidden = true; return; }
    const d = DEFS[it.type], [w, h] = sizeOfType(it.type);
    if (paintOpen) {
      toolbar.innerHTML = (d.tube ? tubeSwatches(it.ci || 0) : paintSwatches(it.paint || 0)) +
        '<button data-act="done" title="Done">✔️</button>';
    } else {
      toolbar.innerHTML =
        (d.refill && fillOf(it) < 1 ? `<button data-act="fill" title="Fill up">${d.refill === 'food' ? '🥣' : '🚰'}</button>` : '') +
        (d.rot ? '<button data-act="turn" title="Turn">🔄</button>' : '') +
        (d.tube || paintable(it.type) ? '<button data-act="colour" title="Change colour">🎨</button>' : '') +
        '<button data-act="bin" title="Throw away">🗑️</button>';
    }
    const half = paintOpen ? 4.2 : 1.8;
    const cx = clamp(it.c + w / 2, half, COLS - half);
    toolbar.style.left = pct(cx, COLS);
    if (it.r >= 1.2) { toolbar.style.top = pct(it.r, ROWS); toolbar.style.transform = 'translate(-50%, -110%)'; }
    else { toolbar.style.top = pct(it.r + h, ROWS); toolbar.style.transform = 'translate(-50%, 10%)'; }
    toolbar.hidden = false;
  }
  toolbar.addEventListener('click', e => {
    e.stopPropagation(); // the toolbar is redrawn below, so don't let the cage see this tap
    const b = e.target.closest('button'); const it = findItem(selectedId);
    if (!b || !it) return;
    const act = b.dataset.act;
    if (act === 'turn') it.rot = ((it.rot || 0) + 1) % 4;
    if (act === 'colour') paintOpen = true;
    if (act === 'done') paintOpen = false;
    if (b.dataset.ci !== undefined) it.ci = +b.dataset.ci;
    if (b.dataset.paint !== undefined) it.paint = +b.dataset.paint;
    if (act === 'fill') { refill(it); return; }
    if (act === 'bin') { removeItem(it.id); return; }
    pop(); save(); renderItems();
  });
  // ---------- Poo! Tap it to clean it up ----------
  function renderPoos() {
    $('poos').innerHTML = state.poos.map(p =>
      `<span class="poo" data-poo="${p.id}" style="left:${pct(p.x, COLS)};top:${pct(p.y, ROWS)}" role="button" aria-label="Poo: tap to clean it up">💩</span>`).join('');
  }
  function dropPoo(x, y) {
    if (state.poos.length >= 12) return;
    state.poos.push({ id: state.nextId++, x: clamp(x, 0.3, COLS - 0.3), y: clamp(y, 0.3, ROWS - 0.3) });
    save(); renderPoos(); renderNeeds();
    beep(220, 140, 0.08, 0.06);
  }
  function cleanPoo(id) {
    const p = state.poos.find(q => q.id === id); if (!p) return;
    state.poos = state.poos.filter(q => q.id !== id); save(); renderPoos();
    const s = document.createElement('span');
    s.className = 'heart'; s.textContent = '✨';
    s.style.left = pct(p.x, COLS); s.style.top = pct(p.y - 0.4, ROWS);
    cage.appendChild(s); setTimeout(() => s.remove(), 1300);
    beep(900, 1600, 0.12, 0.08);
    herd.forEach(h => addNeedFor(h.id, 'fun', 3));
    if (!state.poos.length) say(pickRand(['Sparkly clean! Thank you! ✨', 'Yay, a clean cage! 💖']), 2200);
    renderNeeds();
  }

  function refill(it) {
    it.fill = 1; save(); pop();
    renderItems();
    const d = DEFS[it.type];
    // the hungriest (or thirstiest) hamster says thank you, and comes straight over if it needs it
    const h = [...herd.values()].sort((a, b) => needsOf(a.id)[d.refill] - needsOf(b.id)[d.refill])[0];
    if (!h) return;
    if (needsOf(h.id)[d.refill] < 60) h.commandTo(it);
    h.say(d.refill === 'food' ? 'Ooh, food! Thank you! 💖' : 'Fresh water! Thank you! 💖');
    h.hearts(2);
  }

  // ---------- Drag and tap ----------
  let press = null, justDragged = false;

  function cellAt(x, y, w, h) {
    const r = cage.getBoundingClientRect();
    if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
    const cp = r.width / COLS;
    return {
      c: clamp(Math.round((x - r.left) / cp - w / 2), 0, COLS - w),
      r: clamp(Math.round((y - r.top) / cp - h / 2), 0, ROWS - h),
    };
  }
  function overBin(e) {
    const r = bin.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }

  function startPress(e, info) {
    if (e.button) return;
    e.preventDefault();
    press = { x: e.clientX, y: e.clientY, info, dragging: false };
    // things in the cage need a short hold before they can be picked up (a quick tap sends the hamster)
    if (info.kind === 'placed') {
      // keep following this finger even if the cage pictures get redrawn underneath it
      try { cage.setPointerCapture(e.pointerId); } catch (err) {}
      const mine = press;
      mine.holdT = setTimeout(() => {
        if (press !== mine) return;
        mine.held = true; heldId = info.id;
        const el = itemEl(info.id); if (el) el.classList.add('held');
        beep(500, 820, 0.06, 0.08);
        try { if (navigator.vibrate) navigator.vibrate(25); } catch (err) {}
      }, 380);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }
  function stopListening() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
  }
  function beginDrag() {
    const p = press;
    const it = p.info.kind === 'placed' ? findItem(p.info.id) : { type: p.info.type, ci: state.tubeColour, rot: 0, paint: state.paint };
    if (!it) return false;
    p.dragging = true;
    p.size = sizeOfType(it.type);
    const cp = cellPx();
    ghost.innerHTML = itemHTML(it);
    ghost.style.width = cp * p.size[0] + 'px';
    ghost.style.height = cp * p.size[1] + 'px';
    ghost.hidden = false;
    if (p.info.kind === 'placed') { heldId = null; const el = itemEl(it.id); if (el) { el.classList.remove('held'); el.classList.add('lifted'); } }
    cage.classList.add('placing');
    selectedId = null; renderToolbar();
    return true;
  }
  function onMove(e) {
    if (!press) return;
    if (!press.dragging) {
      const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
      if (press.info.kind === 'placed' && !press.held) {
        // moved before the hold finished: that's not a pick-up (or a tap)
        if (moved > 12) { clearTimeout(press.holdT); press.cancelled = true; }
        return;
      }
      if (moved < 7) return;
      if (!beginDrag()) return;
    }
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    const [w, h] = press.size, cell = cellAt(e.clientX, e.clientY, w, h);
    if (cell) {
      Object.assign(preview.style, { left: pct(cell.c, COLS), top: pct(cell.r, ROWS), width: pct(w, COLS), height: pct(h, ROWS) });
      preview.hidden = false;
    } else preview.hidden = true;
    bin.classList.toggle('hot', overBin(e));
  }
  function endDragVisuals() {
    ghost.hidden = true; preview.hidden = true; bin.classList.remove('hot');
    cage.classList.toggle('placing', !!selectedShelf);
  }
  function onCancel() {
    stopListening();
    if (press) clearTimeout(press.holdT);
    if (press && (press.dragging || press.held)) { heldId = null; endDragVisuals(); renderItems(); }
    press = null;
  }
  function onUp(e) {
    stopListening();
    const p = press; press = null;
    if (!p) return;
    clearTimeout(p.holdT);
    if (!p.dragging) {
      if (p.info.kind === 'shelf') { toggleShelf(p.info.type); return; }
      // a thing in the cage was tapped, or held and let go
      const wasHeld = p.held;
      heldId = null;
      if (selectedShelf) { if (wasHeld) renderItems(); return; }   // the cage click adds the new thing here
      justDragged = true; setTimeout(() => { justDragged = false; }, 80);
      const it = findItem(p.info.id);
      if (!it || p.cancelled) { renderItems(); return; }
      if (wasHeld) { selectedId = it.id; paintOpen = false; renderItems(); return; }   // show paint / turn / bin
      selectedId = null; renderItems();
      if (DEFS[it.type].refill && fillOf(it) <= 0.02) { refill(it); return; }   // empty bowl or bottle: fill it
      const h = current(); if (h) h.commandTo(it);   // the chosen hamster goes
      return;
    }
    justDragged = true; setTimeout(() => { justDragged = false; }, 80);
    endDragVisuals();
    const [w, h] = p.size, cell = cellAt(e.clientX, e.clientY, w, h);
    if (p.info.kind === 'shelf') {
      if (cell) addItem(p.info.type, cell);

  cage.addEventListener('click', e => {

    const hamEl = e.target.closest('.hamster');
    if (hamEl) {
      // tapping a hamster picks it (so taps on things send this one) and gives it a tickle

  function renderSound() { $('sound').textContent = state.sound ? '🔊 Sound on' : '🔇 Sound off'; }

  // ---------- Day and night ----------

  $('daynight').addEventListener('click', () => setNight(!state.night, true));

  setInterval(() => { cycleSecs += 10; if (cycleSecs >= (state.night ? 120 : 180)) setNight(!state.night, true); }, 10000);

  // ---------- The hamsters come alive ----------
  // Each hamster in the cage is made by makeHamster: its own picture, position, timers and needs.
  function makeHamster(id) {
  const ham = document.createElement('div');
  ham.className = 'hamster'; ham.dataset.id = id;

  function tickle() {

  const face = left => hface.classList.toggle('flip', left);

  function goOnto(it, then) {

  }
  const ofKind = test => state.items.filter(it => test(DEFS[it.type]));

  // Try to sort out a need. Returns false if there's nothing in the cage that helps.
  function tryNeed(k) {
    const snacks = ofKind(d => d.snack);
    const bowls = state.items.filter(it => DEFS[it.type].refill === 'food' && fillOf(it) > 0.02);
    const bottles = state.items.filter(it => DEFS[it.type].refill === 'drink' && fillOf(it) > 0.02);
    const beds = ofKind(d => d.sleep || d.inside);
    const fun = ofKind(d => d.svg === 'wheel' || (d.say && !d.snack));
    if (k === 'food') {
      if (snacks.length) { const s = pickRand(snacks); goBeside(s, () => eat(s.id)); return true; }
      if (bowls.length) { const b = pickRand(bowls); goBeside(b, () => eatBowl(b.id)); return true; }
    }
    if (k === 'drink' && bottles.length) { const b = pickRand(bottles); goBeside(b, () => drinkWater(b.id)); return true; }
    if (k === 'sleep' && beds.length) { const b = pickRand(beds); goOnto(b, DEFS[b.type].inside ? hide : nap); return true; }
    const tp = k === 'fun' && findTubePath();
    if (tp && (!fun.length || Math.random() < 0.4)) { runTubes(tp); return true; }
    if (k === 'fun' && fun.length) {
      const t = pickRand(fun), d = DEFS[t.type];

  // Belle tapped something: the hamster stops what it's doing and goes to use it

    squeak(); say(pickRand(['Okay!', 'On my way!', 'Coming!', 'Yes please!']), 1100);
    if (d.snack) return goBeside(it, () => eat(it.id));
    if (d.refill === 'food') return goBeside(it, () => eatBowl(it.id));
    if (d.refill === 'drink') return goBeside(it, () => drinkWater(it.id));
    if (d.svg === 'wheel') return goOnto(it, () => runWheel(it.id));
    if (d.inside) return goOnto(it, () => { hide(); say(it.type === 'log' ? 'Peekaboo!' : 'Home sweet home! 🏠', 2600); });
    if (d.sleep) return goOnto(it, nap);
    if (d.tube) {
      const path = findTubePath(it.c + ',' + it.r);
      if (path) return runTubes(path);

    }
    if (d.say) return (d.on ? goOnto : goBeside)(it, () => play(it));
    goBeside(it, () => { say("Ooh, what's this?"); schedule(1500); });
  }

  function askFor(k) {
    const has = refill => state.items.some(it => DEFS[it.type].refill === refill);
    const lines = {
      food: has('food') ? 'My bowl is empty! Can you fill it? 🥣' : "I'm hungry! Can I have a snack? 🥕",
      drink: has('drink') ? 'My water has run out! 💧' : "I'm thirsty! I need a water bottle! 💧",
      sleep: "I'm sleepy… I need a bed! 😴",
      fun: "I'm bored! Can I have a toy? 🎾",
    };

    setTimeout(() => ham.classList.remove('hop'), 600);
    schedule(4500);
  }

  function nextAction() {
    resetMood();
    // a messy cage gets complained about
    if (state.poos.length >= 4 && Math.random() < 0.2) {
      squeak(); say(pickRand(['Eww! Please clean up the poo! 💩', "It's a bit smelly in here! 🧹"]), 2800);
      ham.classList.add('hop'); setTimeout(() => ham.classList.remove('hop'), 600);
      schedule(3500); return;
    }
    // Look after the most important need first
    const need = lowestNeed(), v = N()[need.k];
    if (v < 40) { if (!tryNeed(need.k)) askFor(need.k); return; }
    if (v < 75 && Math.random() < 0.5 && tryNeed(need.k)) return;

    const snacks = ofKind(d => d.snack), wheels = ofKind(d => d.svg === 'wheel');
    const beds = ofKind(d => d.sleep), hides = ofKind(d => d.inside), fun = ofKind(d => d.say && !d.snack);
    const tubePath = findTubePath();
    const night = !!state.night;

    const choices = [];
    if (snacks.length && N().food < 92) choices.push([4, () => { const s = pickRand(snacks); goBeside(s, () => eat(s.id)); }]);
    if (wheels.length) choices.push([night ? 6 : 2, () => { const w = pickRand(wheels); goOnto(w, () => runWheel(w.id)); }]);
    if (tubePath) choices.push([night ? 6 : 3, () => runTubes(tubePath)]);
    if (hides.length) choices.push([night ? 0.5 : 1.5, () => { const h = pickRand(hides); goOnto(h, hide); }]);
    if (beds.length) choices.push([night ? 0.3 : 1.5, () => { const b = pickRand(beds); goOnto(b, nap); }]);
    if (fun.length) choices.push([night ? 4 : 3, () => { const t = pickRand(fun); (DEFS[t.type].on ? goOnto : goBeside)(t, () => play(t)); }]);
    choices.push([2, () => go(Math.random() * (COLS - HW), Math.random() * (ROWS - HH), () => {
      if (Math.random() < 0.35) say(pickRand(night
        ? ['I love the night! 🌙', 'Look at the stars!', 'Wide awake!']

    })]);
    let pick = Math.random() * choices.reduce((s, c) => s + c[0], 0);
    for (const [w, fn] of choices) { pick -= w; if (pick <= 0) { fn(); return; } }
    choices[choices.length - 1][1]();
  }

  // ---------- Tube running ----------
  // Which sides of a square each tube opens onto, before it's turned
  const TUBE_OPEN = { straight: ['W', 'E'], corner: ['W', 'S'], tee: ['W', 'E', 'S'], cross: ['N', 'E', 'S', 'W'] };
  const CW = ['N', 'E', 'S', 'W'], OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
  const STEP = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  function tubeMap() {
    const m = new Map();
    for (const it of state.items) {
      if (!DEFS[it.type].tube) continue;
      const k = it.c + ',' + it.r, set = m.get(k) || new Set();
      for (const d of TUBE_OPEN[it.type]) set.add(CW[(CW.indexOf(d) + (it.rot || 0)) % 4]);
      m.set(k, set);
    }
    return m;
  }
  function tubeLinks(m, k) {
    const [c, r] = k.split(',').map(Number), out = [];
    for (const d of m.get(k)) {
      const nk = (c + STEP[d][0]) + ',' + (r + STEP[d][1]);
      if (m.has(nk) && m.get(nk).has(OPP[d])) out.push(nk);
    }
    return out;
  }
  // Finds a route through joined-up tubes (at least 2 pieces long)
  function findTubePath(start) {
    const m = tubeMap();
    const joined = [...m.keys()].filter(k => tubeLinks(m, k).length);
    if (!joined.length || (start && !joined.includes(start))) return null;
    const ends = joined.filter(k => tubeLinks(m, k).length === 1);
    let best = null;
    for (let t = 0; t < 6; t++) {
      let cur = start || pickRand(ends.length ? ends : joined);
      const path = [cur], seen = new Set(path);
      while (path.length < 40) {
        const next = tubeLinks(m, cur).filter(k => !seen.has(k));
        if (!next.length) break;
        cur = pickRand(next); seen.add(cur); path.push(cur);
      }
      if (!best || path.length > best.length) best = path;
    }
    return best.length >= 2 ? best.map(k => k.split(',').map(Number)) : null;
  }
  function runTubes(path) {
    const spot = ([c, r]) => [c + 0.5 - HW / 2, r + 0.5 - HH / 2];
    go(...spot(path[0]), () => {
      ham.classList.add('intube', 'walking');
      say(pickRand(['Into the tubes!', 'Wheee, tubes!', 'Zoom zoom!']), 1400); squeak();
      let i = 1;

        if (i >= path.length) {

  }
  function eat(id) {
    if (!findItem(id)) { schedule(600); return; }

  function eatBowl(id) {
    const it = findItem(id);

    say(pickRand(['Crunch crunch!', 'Yummy seeds!'])); munch(); hearts(1); addNeed('food', 35); maybePoo();
    it.fill = Math.max(0, fillOf(it) - 0.34);

    schedule(1800);
  }
  function drinkWater(id) {
    const it = findItem(id);
    if (!it || fillOf(it) <= 0.02) { schedule(600); return; }
    say(pickRand(['Slurp slurp! 💧', 'Ahh, lovely!']));
    beep(900, 500, 0.12, 0.1); setTimeout(() => beep(900, 500, 0.12, 0.08), 220);
    addNeed('drink', 40);

  draw();

  // The hamsters in the cage, and which one Belle is looking after right now
  const herd = new Map();
  const current = () => herd.get(state.ham) || herd.values().next().value;
  function syncHerd() {
    for (const id of state.cage) if (!herd.has(id)) { const h = makeHamster(id); herd.set(id, h); h.start(); }
    for (const [id, h] of herd) if (!state.cage.includes(id)) { h.stop(); herd.delete(id); }
    renderNeeds();
  }
  // things outside the cage talk through the chosen hamster
  function say(text, ms) { const h = current(); if (h) h.say(text, ms); }
  function hearts(n) { const h = current(); if (h) h.hearts(n); }

  // ---------- Mini games ----------
  const modal = $('game'), gbody = $('gameBody');
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  let gameKind = null, maze = null, mazeLevel = 1, race = null, raceRAF = null, countTimers = [];

  function stopRace() { cancelAnimationFrame(raceRAF); countTimers.forEach(clearTimeout); countTimers = []; }
  function closeGame() {
    stopRace(); stopGames(); gameKind = null; modal.hidden = true; document.body.style.overflow = '';

  // Shared bits for the mini games: timers that stop when the game closes, scores, "play again"
  let gTimers = [], gRAF = null, gameKeys = null, gameKeysUp = null;
  const later = (fn, ms) => { const t = setTimeout(fn, ms); gTimers.push(t); return t; };
  const every = (fn, ms) => { const t = setInterval(fn, ms); gTimers.push(t); return t; };
  const rand = (a, b) => a + Math.random() * (b - a);
  const myHam = () => hamsterSVG(hamDef(), outfitOf(state.ham));
  function loop(fn) {
    let last = performance.now();
    const tick = t => {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (fn(dt, t) !== false) gRAF = requestAnimationFrame(tick);
    };
    gRAF = requestAnimationFrame(tick);
  }
  function stopGames() {
    gTimers.forEach(t => { clearTimeout(t); clearInterval(t); }); gTimers = [];
    cancelAnimationFrame(gRAF); gameKeys = gameKeysUp = null;
  }
  function bestScore(id, score, higherIsBetter = true) {
    state.best = state.best || {};
    const old = state.best[id];
    const better = old === undefined || (higherIsBetter ? score > old : score < old);
    if (better) { state.best[id] = score; save(); }
    return { best: state.best[id], isNew: better && old !== undefined };
  }
  const bestText = (b, unit = '') => b.isNew ? ' 🏆 New best!' : ` (Best: ${b.best}${unit})`;
  function finishGame(html, again, rewards, extra = '') {
    Object.entries(rewards || { fun: 15 }).forEach(([k, v]) => addNeed(k, v));
    $('gmsg').innerHTML = `${html}<br>${extra}<button class="btn big" id="gAgain">Play again 🔁</button> <button class="btn" id="gBack">Back to the cage</button>`;

  }
  function countdownThen(el, go) {
    ['3', '2', '1', 'GO!'].forEach((s, i) => later(() => {

  }
  function floatText(area, text, x, y) {

    s.className = 'floaty'; s.textContent = text;
    s.style.left = x + '%'; s.style.top = y + '%';
    area.appendChild(s); setTimeout(() => s.remove(), 1100);
  }
  function tickClock(get, set, onEnd) {
    every(() => { const t = get() - 1; set(t); $('gTime').textContent = '⏱️ ' + t; if (t <= 0) onEnd(); }, 1000);
  }

  function confetti() {
    const card = $('gameCard'), cols = ['#FF7EB3', '#FFD166', '#2FB8A9', '#7CCBFF', '#B79CFF'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = pickRand(cols);
      c.style.animationDelay = Math.random() * 0.6 + 's';
      card.appendChild(c);
      setTimeout(() => c.remove(), 2600);
    }
  }

  // --- Maze ---
  function makeMaze(n) {
    const cells = Array.from({ length: n * n }, () => ({ N: true, E: true, S: true, W: true }));
    const seen = new Set([0]), stack = [0];
    while (stack.length) {
      const cur = stack[stack.length - 1], c = cur % n, r = Math.floor(cur / n), opts = [];
      for (const d of CW) {
        const nc = c + STEP[d][0], nr = r + STEP[d][1];
        if (nc >= 0 && nr >= 0 && nc < n && nr < n && !seen.has(nr * n + nc)) opts.push([d, nr * n + nc]);
      }
      if (!opts.length) { stack.pop(); continue; }
      const [d, nx] = pickRand(opts);
      cells[cur][d] = false; cells[nx][OPP[d]] = false;
      seen.add(nx); stack.push(nx);
    }
    return cells;
  }
  function startMaze() {
    const n = Math.min(5 + mazeLevel * 2, 15);
    const cells = makeMaze(n), seeds = new Set();
    while (seeds.size < 3) seeds.add(1 + Math.floor(Math.random() * (n * n - 2)));
    let walls = '';
    const L = (a, b, c, d) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
    cells.forEach((w, i) => {
      const c = i % n, r = Math.floor(i / n);
      if (w.N) walls += L(c, r, c + 1, r);
      if (w.W) walls += L(c, r, c, r + 1);
      if (c === n - 1 && w.E) walls += L(c + 1, r, c + 1, r + 1);
      if (r === n - 1 && w.S) walls += L(c, r + 1, c + 1, r + 1);
    });
    gbody.innerHTML = `<h2>🌀 Hamster Maze · level ${mazeLevel}</h2>
      <p class="small">Help ${esc(nameOf(state.ham))} find the carrot 🥕! Use the arrow keys, swipe, or tap the arrows. Grab the 🌻 seeds on the way!</p>
      <div class="gstats"><span id="mzSeeds">🌻 0 / 3</span><span id="mzMoves">👣 0 moves</span></div>
      <div class="maze-wrap" id="mazeWrap"><svg viewBox="0 0 ${n} ${n}" preserveAspectRatio="none">
        <g stroke="#8C5A2E" stroke-width="0.16" stroke-linecap="round">${walls}</g></svg></div>
      <div class="pad"><span></span><button data-dir="N" aria-label="Up">⬆️</button><span></span>
        <button data-dir="W" aria-label="Left">⬅️</button><button data-dir="S" aria-label="Down">⬇️</button><button data-dir="E" aria-label="Right">➡️</button></div>
      <p class="gmsg" id="gmsg"></p>`;
    const wrap = $('mazeWrap'), size = 100 / n;
    wrap.style.setProperty('--mzf', (wrap.clientWidth / n * 0.62) + 'px');
    const place = (el, i) => { el.style.left = (i % n) * size + '%'; el.style.top = Math.floor(i / n) * size + '%'; };
    const token = (i, html, cls) => {
      const el = document.createElement('div');
      el.className = 'mz-tok ' + cls; el.style.width = el.style.height = size + '%';
      el.innerHTML = html; place(el, i); wrap.appendChild(el); return el;
    };
    maze = { n, cells, pos: 0, goal: n * n - 1, seeds, got: 0, moves: 0, done: false, place, seedEls: {} };
    maze.goalEl = token(maze.goal, '🥕', 'emo');
    seeds.forEach(k => { maze.seedEls[k] = token(k, '🌻', 'emo'); });
    maze.hamEl = token(0, `<div class="mzham">${hamsterSVG(hamDef(), outfitOf(state.ham))}</div>`, 'me');
    gbody.querySelector('.pad').addEventListener('click', e => { const b = e.target.closest('[data-dir]'); if (b) mazeMove(b.dataset.dir); });
    let sx = 0, sy = 0;
    wrap.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
    wrap.addEventListener('pointerup', e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      mazeMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'E' : 'W') : (dy > 0 ? 'S' : 'N'));
    });
  }
  function mazeMove(d) {
    if (!maze || maze.done) return;
    const { n, cells } = maze;
    if (cells[maze.pos][d]) { beep(220, 160, 0.06, 0.08); return; }   // bumped a wall
    const c = maze.pos % n + STEP[d][0], r = Math.floor(maze.pos / n) + STEP[d][1];
    maze.pos = r * n + c; maze.moves++;
    maze.place(maze.hamEl, maze.pos);
    if (d === 'W' || d === 'E') maze.hamEl.classList.toggle('flip', d === 'W');
    beep(600, 720, 0.04, 0.05);
    if (maze.seeds.has(maze.pos)) {
      maze.seeds.delete(maze.pos); maze.seedEls[maze.pos].remove(); maze.got++;
      beep(800, 1500, 0.12, 0.12);
    }
    $('mzSeeds').textContent = `🌻 ${maze.got} / 3`;
    $('mzMoves').textContent = `👣 ${maze.moves} moves`;
    if (maze.pos === maze.goal) {
      maze.done = true; maze.goalEl.remove(); munch(); squeak(); confetti();
      addNeed('fun', 20); addNeed('food', 10);
      $('gmsg').innerHTML = `🎉 Yay! ${esc(nameOf(state.ham))} found the carrot in ${maze.moves} moves${maze.got === 3 ? ' and got ALL the seeds! 🌟' : '!'}<br>
        <button class="btn big" id="mzNext">Next maze ➡️</button> <button class="btn" id="mzBack">Back to the cage</button>`;
      $('mzNext').addEventListener('click', () => { mazeLevel++; startMaze(); });
      $('mzBack').addEventListener('click', closeGame);
    }
  }

  function raceTap() {
    if (!race || !race.started || race.over) return;
    const me = race.racers.find(r => r.me);
    if (me.place) return;
    me.pos = Math.min(100, me.pos + 2.9); me.lastTap = performance.now();
    beep(700, 820, 0.03, 0.04);
  }
  function raceLoop(t) {
    if (!race || gameKind !== 'race') return;
    const dt = Math.min(0.05, (t - race.last) / 1000); race.last = t;
    race.racers.forEach((r, i) => {
      if (!r.me && !r.place) r.pos = Math.min(100, r.pos + r.speed * dt * (0.8 + Math.random() * 0.4));
      if (r.pos >= 100 && !r.place) r.place = ++race.finished;
      const el = $('racer' + i);
      el.style.left = (r.pos * 0.8) + '%';
      el.classList.toggle('go', !r.place && (r.me ? t - r.lastTap < 250 : true));
    });
    const me = race.racers.find(r => r.me);
    if (!race.over && (me.place || race.finished >= 3)) {
      race.over = true;
      const place = me.place || 4;
      const msg = [
        `🥇 You won! ${esc(me.name)} is the fastest hamster!`,
        '🥈 2nd place! So close!',
        '🥉 3rd place! Good running!',
        "4th place. Keep practising, you can do it! 💪",
      ][place - 1];
      addNeed('fun', 15); addNeed('sleep', -5);
      if (place === 1) { confetti(); squeak(); }
      $('tapRun').disabled = true;
      $('gmsg').innerHTML = `${msg}<br><button class="btn big" id="raceAgain">Race again 🔁</button> <button class="btn" id="raceBack">Back to the cage</button>`;
      $('raceAgain').addEventListener('click', startRace);
      $('raceBack').addEventListener('click', closeGame);
    }
    // let the others finish running across the line, then stop
    if (race.racers.every(r => r.place || (r.me && race.over))) return;
    raceRAF = requestAnimationFrame(raceLoop);
  }

  document.addEventListener('keydown', e => {

    if (gameKind === 'maze' && keys[e.key]) { e.preventDefault(); mazeMove(keys[e.key]); }
    if (gameKind === 'race' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); if (!e.repeat) raceTap(); }

        const centre = 50 + 25 * Math.sin(clock * 0.45), half = 11;   // the green zone drifts about
        $('zone').style.left = (centre - half) + '%'; $('zone').style.width = (half * 2) + '%';
        $('needle').style.left = speed + '%';
        angle += speed * 7 * dt; spinner.style.transform = `rotate(${angle}deg)`;
        const ok = Math.abs(speed - centre) <= half;
        if (ok) inZone += dt;
        $('gScore').textContent = `✅ ${Math.floor(inZone)} s`;
        $('wh').classList.toggle('run', speed > 8 && speed <= centre + half);
        $('wh').classList.toggle('dizzy', speed > centre + half);
        chat -= dt;
        if (chat <= 0) { chat = 2.2; floatText($('arena'), ok ? pickRand(['Just right!', 'Wheee!']) : speed < centre ? 'Yawn… faster! 😴' : 'Too fast! 😵', 50, 14); }
      });
    });
    function end() {
      const s = Math.floor(inZone), stars = s >= 20 ? ' ⭐⭐⭐' : s >= 12 ? ' ⭐⭐' : s >= 5 ? ' ⭐' : '';
      const b = bestScore('wheel', s);
      if (s >= 20) confetti();
      finishGame(`🎉 You kept it just right for <b>${s}</b> seconds!${stars}${bestText(b, ' s')}`, startWheelGame, { fun: 20, sleep: -5 });
    }
  }

  // --- Hamster Ball Roll ---
  function startBall() {
    stopGames();
    gbody.innerHTML = `<h2>🫧 Hamster Ball Roll</h2>
      <p class="small">Roll around the garden collecting seeds 🌻! Hold your finger (or the mouse button) where you want to go, or use the arrow keys. The cat 🐱 only wants a sniff, but roll away or you'll drop a seed!</p>
      <div class="gstats"><span id="gScore">🌻 0</span><span id="gTime">⏱️ 40</span></div>
      <div class="arena garden" id="arena"><div class="spr hball" id="hb"><div class="inham">${myHam()}</div>${BALL}</div><div class="spr cat" id="cat">🐱</div><div class="count" id="count"></div></div>
      <p class="gmsg" id="gmsg"></p>`;
    const arena = $('arena'), hb = $('hb'), cat = $('cat'), ballPic = hb.lastElementChild;
    let x = 50, y = 55, vx = 0, vy = 0, cx = 10, cy = 12, score = 0, time = 40, playing = false, aim = null, seeds = [], bump = 0, roll = 0;
    const keys = {};
    for (let i = 0; i < 10; i++) {
      const f = document.createElement('div');
      f.className = 'spr deco'; f.textContent = pickRand(['🌷', '🌼', '🍀', '🌸']);
      f.style.left = rand(4, 96) + '%'; f.style.top = rand(4, 96) + '%';
      arena.insertBefore(f, arena.firstChild);
    }
    const pt = e => { const r = arena.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
    arena.addEventListener('pointerdown', e => { aim = pt(e); try { arena.setPointerCapture(e.pointerId); } catch (err) {} });
    arena.addEventListener('pointermove', e => { if (aim) aim = pt(e); });
    arena.addEventListener('pointerup', () => { aim = null; });
    arena.addEventListener('pointercancel', () => { aim = null; });
    gameKeys = e => { if (e.key.startsWith('Arrow')) { e.preventDefault(); keys[e.key] = true; } };
    gameKeysUp = e => { keys[e.key] = false; };
    const addSeed = () => {
      const el = document.createElement('div');
      el.className = 'spr seed'; el.textContent = '🌻';
      const s = { el, x: rand(8, 92), y: rand(10, 90) };
      el.style.left = s.x + '%'; el.style.top = s.y + '%';
      arena.appendChild(el); seeds.push(s);
    };
    for (let i = 0; i < 5; i++) addSeed();
    const draw = () => { hb.style.left = x + '%'; hb.style.top = y + '%'; cat.style.left = cx + '%'; cat.style.top = cy + '%'; };
    draw();
    countdownThen($('count'), () => {
      playing = true;
      tickClock(() => time, t => { time = t; }, () => { playing = false; end(); });
      loop(dt => {
        if (!playing) return false;
        let ax = 0, ay = 0;
        if (aim) { const dx = aim[0] - x, dy = (aim[1] - y) * 0.75, d = Math.hypot(dx, dy); if (d > 2) { ax = dx / d; ay = dy / d; } }
        if (keys.ArrowLeft) ax -= 1; if (keys.ArrowRight) ax += 1; if (keys.ArrowUp) ay -= 1; if (keys.ArrowDown) ay += 1;
        const damp = Math.pow(0.35, dt);
        vx = (vx + ax * 72 * dt) * damp; vy = (vy + ay * 96 * dt) * damp;
        x += vx * dt; y += vy * dt;
        if (x < 6 || x > 94) { vx = -vx * 0.6; x = clamp(x, 6, 94); }
        if (y < 8 || y > 92) { vy = -vy * 0.6; y = clamp(y, 8, 92); }
        roll += vx * dt * 12; ballPic.style.transform = `rotate(${roll}deg)`;
        // the cat ambles after the ball, a little faster as time goes on
        const cdx = x - cx, cdy = y - cy, cd = Math.hypot(cdx, cdy) || 1, cs = 10 + (40 - time) * 0.35;
        cx += cdx / cd * cs * dt; cy += cdy / cd * cs * 1.33 * dt;
        cat.classList.toggle('flip', cdx > 0);
        bump -= dt;
        if (cd < 9 && bump <= 0) {
          bump = 1.2; vx = cdx / cd * 60; vy = cdy / cd * 60;
          if (score > 0) score--;
          $('gScore').textContent = '🌻 ' + score; beep(400, 200, 0.15, 0.1); floatText(arena, 'Sniff sniff! 🐱', x, y - 10);
        }
        for (const s of seeds) {
          if (Math.abs(s.x - x) < 6 && Math.abs(s.y - y) < 8) {
            s.got = true; s.el.remove(); score++;
            $('gScore').textContent = '🌻 ' + score; beep(800, 1400, 0.08, 0.08); floatText(arena, '+1', s.x, s.y);
          }
        }
        if (seeds.some(s => s.got)) { seeds = seeds.filter(s => !s.got); while (seeds.length < 5) addSeed(); }
        draw();
      });
    });
    function end() {
      const b = bestScore('ball', score);
      if (score >= 20) confetti();
      finishGame(`🎉 You collected <b>${score}</b> seeds!${bestText(b)}`, startBall, { fun: 20, food: 10 });
    }
  }

  // --- Hide and Seek ---
  function startSeek(round = 1, looks = 0) {
    stopGames();
    const SPOTS = ['🛋️', '🪴', '📦', '🧺', '👟', '🎒', '📚', '🪣', '🧸', '🧦', '🎁', '🥾'].sort(() => Math.random() - 0.5);
    const COLS4 = 4, hideAt = Math.floor(Math.random() * SPOTS.length);
    gbody.innerHTML = `<h2>🔍 Hide and Seek · round ${round} of 3</h2>
      <p class="small">${esc(nameOf(state.ham))} is hiding! Tap things to look behind them. Follow the clues: 🔥 hot means really close, ❄️ cold means far away.</p>
      <div class="gstats"><span id="gScore">👀 ${looks} looks</span><span id="clue">🤔 Where could they be?</span></div>
      <div class="room" id="room">${SPOTS.map((s, i) => `<button class="spot" data-i="${i}"><span class="thing">${s}</span></button>`).join('')}</div>
      <p class="gmsg" id="gmsg"></p>`;
    let found = false;
    $('room').addEventListener('click', e => {
      const b = e.target.closest('.spot');
      if (!b || found || b.classList.contains('looked')) return;
      looks++; $('gScore').textContent = `👀 ${looks} looks`;
      const i = +b.dataset.i;
      if (i === hideAt) {
        found = true; b.classList.add('found');
        b.insertAdjacentHTML('beforeend', `<span class="peek">${myHam()}</span>`);
        squeak(); $('clue').textContent = '🎉 You found me!';
        if (round < 3) {
          $('gmsg').innerHTML = `🎉 Found! <button class="btn big" id="gNext">Next round ➡️</button>`;
          $('gNext').addEventListener('click', () => startSeek(round + 1, looks));
        } else {
          confetti();
          const best = bestScore('seek', looks, false);
          finishGame(`🎉 You found ${esc(nameOf(state.ham))} 3 times in <b>${looks}</b> looks!${bestText(best, ' looks')}`, () => startSeek(1, 0));
        }
      } else {
        b.classList.add('looked');
        const d = Math.hypot(i % COLS4 - hideAt % COLS4, Math.floor(i / COLS4) - Math.floor(hideAt / COLS4));
        const [icon, word] = d < 1.5 ? ['🔥', 'Hot! Really close!'] : d < 2.5 ? ['🌤️', 'Warm…'] : ['❄️', 'Cold! Far away.'];
        $('clue').textContent = `${icon} ${word}`;
        beep(d < 1.5 ? 900 : d < 2.5 ? 600 : 300, d < 1.5 ? 1100 : 600, 0.1, 0.08);
        b.insertAdjacentHTML('beforeend', `<span class="hint">${icon}</span>`);
      }
    });
  }

  // --- Fashion Show ---
  const THEMES = [
    { name: 'Party time! 🎉', best: { head: ['party', 'unicorn'], face: ['stars', 'hearts'], neck: ['bowtie'] }, ok: { head: ['crown', 'bow', 'headphones', 'wizard'], face: ['cool'], neck: ['pearls', 'lei', 'medal'] }, cols: ['pink', 'purple', 'yellow', 'orange', 'sky'] },
    { name: 'Snowy day ❄️', best: { head: ['beanie'], face: ['round', 'goggles'], neck: ['scarf'] }, ok: { head: ['tophat', 'bow', 'bunny', 'headphones'], face: ['cool'], neck: ['bowtie', 'bandana'] }, cols: ['white', 'sky', 'blue', 'red', 'silver'] },
    { name: 'Royal ball 👑', best: { head: ['crown', 'tiara', 'tophat'], face: ['round', 'monocle'], neck: ['pearls', 'locket'] }, ok: { head: ['flowers', 'bow'], face: ['stars'], neck: ['bowtie', 'medal'] }, cols: ['purple', 'yellow', 'black', 'white', 'silver'] },
    { name: 'Beach day 🏖️', best: { head: ['sunhat', 'flowers'], face: ['cool', 'hearts'], neck: ['', 'lei'] }, ok: { head: ['bow', 'party', 'cowboy'], face: ['stars', 'goggles'], neck: ['pearls', 'bandana'] }, cols: ['yellow', 'orange', 'sky', 'teal'] },
    { name: 'Garden party 🌸', best: { head: ['flowers', 'bow', 'sunhat'], face: ['hearts', 'round'], neck: ['pearls', 'bowtie', 'locket'] }, ok: { head: ['tophat', 'party', 'bunny'], face: ['stars'], neck: ['scarf', 'lei'] }, cols: ['pink', 'green', 'white', 'yellow'] },
    { name: 'Superhero ⚡', best: { head: [''], face: ['mask'], neck: ['medal'] }, ok: { head: ['headphones'], face: ['goggles', 'cool'], neck: ['bandana'] }, cols: ['red', 'blue', 'yellow', 'black'] },
    { name: 'Magic show 🪄', best: { head: ['wizard', 'tophat', 'unicorn'], face: ['stars', 'monocle'], neck: ['bowtie'] }, ok: { head: ['crown', 'tiara'], face: ['round'], neck: ['locket', 'pearls'] }, cols: ['purple', 'black', 'sky', 'silver'] },
  ];
  function startFashion() {
    stopGames();
    const th = pickRand(THEMES), o = Object.assign({}, outfitOf(state.ham));
    gbody.innerHTML = `<h2>👗 Fashion Show</h2>
      <p class="theme">Today's theme: <b>${th.name}</b></p>
      <p class="small">Dress ${esc(nameOf(state.ham))} to match the theme (colours count too!), then send them down the catwalk.</p>
      <div class="runway" id="runway"><div class="judges" id="judges" hidden></div><div class="fsham" id="fsHam"></div></div>
      <div class="dress" id="fsPick"></div>
      <div style="text-align:center;margin-top:12px"><button class="tapbtn" id="walk">✨ Walk the catwalk!</button></div>
      <p class="gmsg" id="gmsg"></p>`;
    const draw = () => { $('fsHam').innerHTML = hamsterSVG(hamDef(), o); $('fsPick').innerHTML = dressHTML(o); };
    draw();
    $('fsPick').addEventListener('click', e => { const b = e.target.closest('.acc, .sw'); if (!b) return; applyDress(o, b); pop(); draw(); });
    $('walk').addEventListener('click', () => {
      $('walk').disabled = true; $('fsPick').hidden = true;
      $('fsHam').classList.add('strut'); squeak();
      let pts = 0;
      for (const slot of ['head', 'face', 'neck']) {
        const v = o[slot] || '';
        pts += th.best[slot].includes(v) ? 2 : th.ok[slot].includes(v) ? 1 : 0;
        if (v && th.cols.includes(slotColour(o, slot))) pts += 0.5;
      }
      const judges = HAMSTERS.filter(h => h.id !== state.ham).sort(() => Math.random() - 0.5).slice(0, 3);
      const stars = judges.map(() => clamp(Math.round(pts / 7.5 * 5 + rand(-0.6, 0.6)), 1, 5));
      later(() => {
        $('judges').hidden = false;
        $('judges').innerHTML = judges.map((h, i) => `<div class="judge">${hamsterSVG(h)}<span>${'⭐'.repeat(stars[i])}</span></div>`).join('');
        const avg = stars.reduce((a, b) => a + b, 0) / 3;
        const total = stars.reduce((a, b) => a + b, 0);
        if (avg >= 4.5) { confetti(); squeak(); }
        const b = bestScore('fashion', total);
        const msg = avg >= 4.5 ? '🌟 Superstar! The crowd goes wild!' : avg >= 3 ? '👏 What a lovely outfit!' : '😊 Nice try! Try matching the theme a bit more.';
        finishGame(`${msg} <b>${total}</b> stars out of 15!${bestText(b, ' stars')}`, startFashion, { fun: 15 },
          '<button class="btn" id="gKeep">💾 Keep this outfit</button> ');
        $('gKeep').addEventListener('click', () => {
          state.outfits = state.outfits || {}; state.outfits[state.ham] = Object.assign({}, o); save();
          renderPicker(); drawHamster(); $('gKeep').textContent = '✅ Outfit saved!'; $('gKeep').disabled = true;
        });
      }, 2200);
    });
  }

  const GAME_LIST = [
    ['maze', '🌀', 'Hamster Maze', 'Help your hamster find the carrot!', startMaze],
    ['race', '🏁', 'Hamster Race', "Who's the fastest hamster?", startRace],
    ['catch', '🌻', 'Seed Catch', 'Catch the seeds, dodge the peppers!', startCatch],
    ['cheeks', '🥜', 'Cheek Stuffer', 'Stuff those cheeks super fast!', startCheeks],
    ['burrow', '🕳️', 'Burrow Pop', 'Tap the hungry hamsters, not the sleepy ones!', startBurrow],
    ['memory', '🧠', 'Memory Match', 'Find all the matching pairs.', startMemory],
    ['wheel', '🎡', 'Wheel Power', 'Keep the wheel spinning just right.', startWheelGame],
    ['ball', '🫧', 'Ball Roll', 'Roll around the garden collecting seeds.', startBall],
    ['seek', '🔍', 'Hide and Seek', 'Can you find your hamster?', () => startSeek(1, 0)],
    ['fashion', '👗', 'Fashion Show', 'Dress up to match the theme!', startFashion],
  ];
  const GAME_START = Object.fromEntries(GAME_LIST.map(g => [g[0], g[4]]));
  $('games').innerHTML = GAME_LIST.map(([id, icon, name, desc]) =>
    `<button class="game" data-game="${id}"><div class="big">${icon}</div><div><b>${name}</b>${desc}<br><span class="soon">▶ Play</span></div></button>`).join('');

  // ---------- Start ----------
  syncHerd();
  renderPicker(); drawHamster(); renderShelf(); renderItems(); renderPoos(); updateHelp(); renderSound();
  setNight(!!state.night, false);
  herd.forEach(h => setTimeout(() => h.say(`Hi, I'm ${nameOf(h.id)}!`), 600 + Math.random() * 900));
})();
</script>
</body>
</html>
